    onStateChange: setPlayLabel,
    // Surfaced only when the highlight is running on an estimate, because
    // that is the case the reader deserves to know about.
    onTimingMode: (mode) => {
      el.timingMode.classList.toggle("show", mode === "estimated");
    },
    onDone: () => {
      el.progressFill.style.width = "100%";
      el.timingMode.classList.remove("show");
    },
  });

  if (Engine === AndroidTtsEngine) {
    // The bridge reports when the platform engine has finished initialising;
    // asking for voices before that returns nothing.
    let userPickedVoiceName = null;

    const fillAndroidVoices = () => {
      const voices = app.engine.listVoices();
      if (!voices.length) return;
      renderGroupedVoices(el.voice, voices.map((v) => ({
        value: v.name, label: `${v.locale}${v.network ? " (network)" : ""}`, lang: v.locale, local: !v.network,
      })));

      let chosen = userPickedVoiceName && voices.find(v => v.name === userPickedVoiceName);
      if (!chosen) chosen = voices.find(v => !v.network && /^en/i.test(v.locale)) || voices[0];
      el.voice.value = chosen.name;
      app.engine.setVoiceByName(chosen.name);
    };

    app.engine.onReady = fillAndroidVoices;
    if (window.AndroidTTS.isReady()) fillAndroidVoices();

    el.voice.addEventListener("change", () => {
      app.engine.setVoiceByName(el.voice.value);
      userPickedVoiceName = el.voice.value;
    });
  } else {
    // Voices populate asynchronously — the first getVoices() call returns [].
    let userPickedVoice = null; // { name, lang } once the user manually chooses one

    const loadVoices = () => {
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      renderGroupedVoices(el.voice, voices.map((v, i) => ({
        value: i, label: `${v.name}${v.localService ? "" : " (network)"}`, lang: v.lang, local: v.localService,
      })));

      // A later voiceschanged firing — e.g. while new system voices are still
      // being installed — used to always re-apply the default heuristic
      // here, silently overriding a voice the user had already picked
      // mid-read. Once picked, that choice is now re-resolved against the
      // fresh list by name+lang (indices aren't stable across getVoices()
      // calls), so only the first population — or a picked voice actually
      // disappearing — falls back to the default.
      let index = userPickedVoice
        ? voices.findIndex(v => v.name === userPickedVoice.name && v.lang === userPickedVoice.lang)
        : -1;
      if (index < 0) index = voices.findIndex(v => v.localService && /^en/i.test(v.lang));
      el.voice.value = index >= 0 ? index : 0;
      app.engine.voice = voices[el.voice.value];
    };

    loadVoices();
    speechSynthesis.addEventListener("voiceschanged", loadVoices);

    el.voice.addEventListener("change", () => {
      const v = speechSynthesis.getVoices()[el.voice.value];
      app.engine.voice = v;
      userPickedVoice = v ? { name: v.name, lang: v.lang } : null;
    });
  }

  el.play.addEventListener("click", () => {
    // Drop focus, or the button keeps Space to itself and the global
    // shortcut below would fight with the browser's own activation.
    el.play.blur();
    togglePlayback();
  });

  el.stop.addEventListener("click", () => {
    app.engine.stop();
    app.renderer.clear();
    updateProgress(-1);
    el.timingMode.classList.remove("show");
  });

  el.rate.addEventListener("input", () => {
    const r = parseFloat(el.rate.value);
    el.rateVal.textContent = `${+r.toFixed(2)}×`;
    app.engine.setRate(r);
    updateProgress(app.renderer.active);   // rate changes the time estimate
    syncSpeedSlider();
    renderDial();
  });

  el.reader.addEventListener("click", (e) => {
    const span = e.target.closest(".w");
    if (span) app.seekToToken(parseInt(span.dataset.i, 10));
  });

  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat) return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;

    // Leave Space alone wherever it already means something: typing in the
    // editor, toggling a checkbox, opening a select.
    const a = document.activeElement;
    if (a && (a.isContentEditable || ["TEXTAREA", "INPUT", "SELECT"].includes(a.tagName))) return;

    e.preventDefault();     // also stops the page scrolling
    togglePlayback();
  });
}

el.edit.addEventListener("click", () => {
  const editing = !el.editor.classList.contains("hidden");
  if (editing) {
    loadRaw(el.editor.value, "edited text");
    el.editor.classList.add("hidden");
    el.reader.classList.remove("hidden");
    el.edit.textContent = "Edit text";
  } else {
    // Show the untouched source, not the cleaned rendering — otherwise
    // editing would silently bake the stripping into the text.
    el.editor.value = app.raw ? app.raw.text : app.text;
    el.editor.classList.remove("hidden");
    el.reader.classList.add("hidden");
    el.edit.textContent = "Done";
  }
});

el.clean.addEventListener("change", async () => {
  if (!app.raw) return;
  app.engine?.stop();
  app.renderer.clear();
  const doc = await prepareDoc(app.raw.text, app.raw);
  app.load(doc.text, doc.tree);
  toast(el.clean.checked ? "Formatting rendered" : "Showing raw source");
});

/* ------------------------------------------------------------------ *
 * 6. IMPORTERS
 *
 * Every importer is a text producer: whatever the source, it resolves to
 * a plain string and hands it to app.load(). The tokenizer and engine
 * never learn where the text came from, which is what keeps adding
 * formats cheap — a PDF or EPUB importer slots in here and nothing
 * downstream changes.
 * ------------------------------------------------------------------ */

const TEXT_EXT = /\.(txt|md|markdown|text)$/i;

/** Strip Markdown syntax that would otherwise be read aloud literally.
 *  Without this, "## Heading" is spoken as "hash hash Heading", a link is
 *  read with its URL, and a table is read as a wall of pipe characters.
 *
 *  Order matters: code fences go first so their contents can't be mangled
 *  by later rules, block-level syntax before inline, and emphasis last. */
function stripMarkdown(src) {
  // Backslash-escaped punctuation is stashed before anything else runs.
  // Otherwise an escaped \* is still a bare asterisk during emphasis
  // matching, and a lone asterisk elsewhere in the document pairs with it,
  // swallowing everything in between.
  const S = "\0";
  const stashed = src.replace(
    /\\([\\`*_{}\[\]()#+\-.!>~|])/g,
    (_, c) => S + c.charCodeAt(0) + S
  );

  const out = stashed
    // Code blocks go first, so their contents cannot be mangled by any
    // later rule. Reading source aloud helps nobody.
    .replace(/^[ \t]*(```|~~~)[\s\S]*?^[ \t]*\1[ \t]*$/gm, "")
    .replace(/<!--[\s\S]*?-->/g, "")                       // HTML comments
    .replace(/<\/?[a-zA-Z][^>]*>/g, "")                    // inline HTML tags
    .replace(/^\s{0,3}\[[^\]]+\]:\s*\S+.*$/gm, "")         // link definitions
    .replace(/^([^\n]+)\n[ \t]{0,3}[=-]{2,}[ \t]*$/gm, "$1")  // setext headings
    .replace(/^\s{0,3}#{1,6}\s+/gm, "")                    // ATX headings
    .replace(/[ \t]+#+[ \t]*$/gm, "")                      // closing hashes
    .replace(/^\s{0,3}>[ \t]?/gm, "")                      // blockquotes
    .replace(/^\s{0,3}([-*_])[ \t]*(?:\1[ \t]*){2,}$/gm, "")  // horizontal rules
    .replace(/^\s*[-*+][ \t]+\[[ xX]\][ \t]+/gm, "")       // task list items
    .replace(/^\s*[-*+][ \t]+/gm, "")                      // bullets
    .replace(/^\s*\d+[.)][ \t]+/gm, "")                    // ordered lists
    // Tables: drop the separator row, then read the cells as a comma list.
    .replace(/^[ \t]*\|?[ \t]*:?-{2,}:?[ \t]*(\|[ \t]*:?-{2,}:?[ \t]*)+\|?[ \t]*$/gm, "")
    .replace(/^[ \t]*\|(.+)\|[ \t]*$/gm,
      (_, row) => row.split("|").map((c) => c.trim()).filter(Boolean).join(", "))
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1")              // images -> alt text
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")               // inline links -> text
    .replace(/\[([^\]]+)\]\[[^\]]*\]/g, "$1")              // reference links
    .replace(/<((?:https?|mailto):[^>]+)>/g, "$1")         // autolinks
    .replace(/`+([^`]+)`+/g, "$1")                         // inline code
    .replace(/~~([^~]+)~~/g, "$1")                         // strikethrough
    // Emphasis must not span a blank line: a stray marker in one paragraph
    // would otherwise pair with one several paragraphs away.
    .replace(/(\*\*\*|___)(\S(?:(?:(?!\n\n)[\s\S])*?\S)?)\1/g, "$2")
    .replace(/(\*\*|__)(\S(?:(?:(?!\n\n)[\s\S])*?\S)?)\1/g, "$2")
    .replace(/\*(\S(?:[^*\n]*?\S)?)\*/g, "$1")             // italic
    // Underscore italics only at word boundaries, so snake_case survives.
    .replace(/(^|[^A-Za-z0-9_])_(\S(?:[^_\n]*?\S)?)_(?![A-Za-z0-9])/g, "$1$2")
    .replace(/[ \t]+$/gm, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();

  // Restore the escaped characters as their literal selves.
  return out.replace(
    /\0(\d+)\0/g,
    (_, code) => String.fromCharCode(Number(code))
  );
}

/* Every pattern here is already a well-formed construct — a matched bold
   pair, a list marker plus its content, a fenced block — not a single
   stray character, so one match is enough evidence on its own. This used
   to require two independent signals, on the theory that ordinary prose
   containing an asterisk shouldn't be quietly rewritten. In practice that
   let through exactly the short, single-signal replies a chat assistant
   commonly pastes in — a paragraph or two with only **bold** terms and no
   headings or lists — which then displayed and were read aloud with their
   literal markdown syntax intact. */
const MARKDOWN_SIGNALS = [
  /^\s{0,3}#{1,6}\s+\S/m,
  /^\s{0,3}[-*+][ \t]+\S/m,
  /^\s{0,3}\d+[.)][ \t]+\S/m,
  /\[[^\]]+\]\([^)]+\)/,
  /(^|\n)[ \t]*(```|~~~)/,
  /\*\*\S[\s\S]*?\S\*\*/,
  /^\s{0,3}>[ \t]+\S/m,
];

/**
 * ChatGPT's own "Copy" button — verified directly by intercepting its
 * clipboard write — puts a table on the clipboard as plain tab-separated
 * text, the same convention as copying out of a spreadsheet: no Markdown
 * pipe syntax, no HTML, nothing else for the Markdown/HTML detection below
 * to find at all. A run of two or more consecutive lines that each split
 * on tab into the same number of fields (more than one) is a strong,
 * unambiguous signal on its own — ordinary prose essentially never
 * contains a literal tab character, let alone a rectangular grid of them —
 * so this rewrites that shape into real pipe-table syntax before anything
 * else inspects the text, letting the normal Markdown path pick it up
 * unchanged. Runs even when nothing else here looks like Markdown, since a
 * bare copied table has no other structure to trigger detection with.
 */
function tsvBlocksToMarkdownTables(raw) {
  const lines = raw.split("\n");
  const cols = (l) => l.split("\t").length;
  const emit = (out, rowLines) => {
    const rows = rowLines.map((l) => l.split("\t").map((c) => c.trim().replace(/\|/g, "\\|")));
    out.push("| " + rows[0].join(" | ") + " |");
    out.push("| " + rows[0].map(() => "---").join(" | ") + " |");
    for (const row of rows.slice(1)) out.push("| " + row.join(" | ") + " |");
  };

  const out = [];
  let i = 0;
  while (i < lines.length) {
    const c = cols(lines[i]);
    if (c >= 2) {
      // A copied table commonly keeps a blank line between its header row
      // and its body, the way the source app visually separated them —
      // without checking for it, that header line reads as plain text on
      // its own and the first *data* row gets mistaken for the header.
      if (lines[i + 1] === "" && lines[i + 2] !== undefined && cols(lines[i + 2]) === c) {
        let j = i + 2;
        while (j < lines.length && cols(lines[j]) === c) j++;
        emit(out, [lines[i], ...lines.slice(i + 2, j)]);
        i = j;
        continue;
      }

      let j = i + 1;
      while (j < lines.length && cols(lines[j]) === c) j++;
      if (j - i >= 2) {
        emit(out, lines.slice(i, j));
        i = j;
        continue;
      }
    }
    out.push(lines[i]);
    i++;
  }
  return out.join("\n");
}

function looksLikeMarkdown(s) {
  if (MARKDOWN_SIGNALS.some((re) => re.test(s))) return true;
  // A table needs its own two-line check — a header row plus its separator
  // — rather than a single-line regex, now that a row's leading/trailing
  // pipes are optional (see isTableRow/isTableSeparator).
  const lines = s.split("\n");
  return lines.some((l, i) => isTableRow(l) && lines[i + 1] !== undefined && isTableSeparator(lines[i + 1]));
}

/** Every input path funnels through here, so pasted and typed Markdown is
 *  cleaned exactly like a dropped .md file. Async because rendering now
 *  means loading marked on first use — same lazy-CDN shape as PDF/EPUB, so
 *  plain text and typed prose never pay for a library they don't need. */
async function prepareDoc(raw, { forceMarkdown = false, cleanable = true, html = null } = {}) {
  if (!cleanable || !el.clean.checked) return { text: raw, tree: null };

  // Only used for detection/parsing below, never for the flat-text
  // fallback further down — that one should still show the original raw
  // text a user actually copied, tabs and all, not a synthetic table it
  // was rewritten into for parsing purposes.
  const md = tsvBlocksToMarkdownTables(raw);

  // A document can have real Markdown syntax (headings, a "---" rule, bold
  // text) everywhere *except* its table — some sources keep a genuine
  // <table> in their clipboard HTML while flattening those same rows to
  // tab-separated plain text with no pipe syntax at all (ChatGPT's "Copy"
  // button does this). Picking one flavour for the whole document either
  // way loses something: Markdown-only misses that table; HTML-only risks
  // the "styled <div>s, no real <table>" case the other direction. So both
  // are parsed when both are available, and whichever one actually has a
  // table wins — Markdown otherwise, since it preserves spoken punctuation
  // and inline formatting more faithfully than a third party's clipboard
  // HTML.
  let mdTree = null;
  if (forceMarkdown || looksLikeMarkdown(md)) {
    try {
      mdTree = await markdownToDom(md);
    } catch (err) {
      toast("Couldn't load the Markdown renderer — this needs a network connection. Showing raw text.");
      return { text: raw, tree: null };
    }
    if (!mdTree.childNodes.length) mdTree = null;
  }

  let htmlTree = null;
  if (html) {
    htmlTree = sanitizeHtmlDoc(
      new DOMParser().parseFromString(html, "text/html"),
      (imgSrc) => (SAFE_IMAGE.test(imgSrc) ? imgSrc : null)
    );
    if (!htmlTree.childNodes.length) htmlTree = null;
  }

  if (mdTree || htmlTree) {
    const hasTable = (t) => !!t?.querySelector("table");
    const preferHtml = htmlTree && hasTable(htmlTree) && !hasTable(mdTree);
    return { text: null, tree: preferHtml ? htmlTree : (mdTree || htmlTree) };
  }

  if (!forceMarkdown && !looksLikeMarkdown(md)) return { text: raw, tree: null };

  // Nothing parsed into blocks. Fall back to stripping the syntax so the
  // symbols still are not read aloud, and never hand back an empty document.
  const cleaned = stripMarkdown(md);
  return { text: cleaned.trim() ? cleaned : raw, tree: null };
}

function toast(msg, ms = 2600) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("on"), ms);
}

function setSource(label, fullLabel = label) {
  const el = document.getElementById("source");
  el.textContent = label;
  el.title = fullLabel;   // full text on hover when the visible label is shortened
}

/* ---------------------------- PDF ---------------------------------- *
 * PDFs store glyphs at coordinates, not sentences, and drawing order is
 * often unrelated to reading order. Each page is rasterized to a canvas
 * exactly as designed, with pdf.js's own invisible text layer positioned
 * on top of it — see extractPdfOriginalLayout below.
 * ------------------------------------------------------------------- */

const PDFJS_VERSION = "4.10.38";
const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}`;
let pdfjsPromise = null;

/** Fetched on first PDF only, so text and Markdown stay fully offline. */
function loadPdfJs() {
  if (!pdfjsPromise) {
    pdfjsPromise = import(/* webpackIgnore: true */ `${PDFJS_BASE}/pdf.min.mjs`)
      .then((mod) => {
        mod.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/pdf.worker.min.mjs`;
        return mod;
      })
      .catch((err) => { pdfjsPromise = null; throw err; });
  }
  return pdfjsPromise;
}

// Written as escapes, not literal glyphs: if this file is ever served
// without a UTF-8 charset, literal ligatures decode to mojibake and the
// character-class range below becomes a parse error that kills the whole
// script. Escapes survive that.
const LIGATURES = {
  "\uFB00": "ff", "\uFB01": "fi", "\uFB02": "fl",
  "\uFB03": "ffi", "\uFB04": "ffl", "\uFB05": "st", "\uFB06": "st",
};

// Built from LIGATURES' own keys and a numeric char code rather than
// written as escapes a second time here, so there's exactly one place in
// the file spelling out these code points instead of two copies that
// could quietly drift apart.
const LIGATURE_RE = new RegExp("[" + Object.keys(LIGATURES).join("") + "]", "g");
const SOFT_HYPHEN = String.fromCharCode(173);

/**
 * Each page is rendered to a canvas exactly as the PDF specifies, and
 * pdf.js's own TextLayer — the same technique a browser's native PDF
 * viewer uses to make rendered text selectable — positions an invisible
 * copy of the text directly on top of it. Splitting each positioned text
 * run into its own per-word span turns that invisible layer into the
 * same {tree, spans} shape buildFromDom produces for Markdown and EPUB,
 * so the highlight, autoscroll, and sentence-band code needs no changes
 * at all to work here — the one difference is that app.load takes this
 * bundle pre-built (see the `prebuilt` note there) rather than deriving
 * it from the tree.
 *
 * PDF drawing order is often unrelated to visible reading order: a word
 * can be painted after text from elsewhere on the page. The timing track
 * therefore follows visual lines (top-to-bottom, then left-to-right), not
 * the raw content stream. This keeps the word the voice says tied to the
 * word it highlights on ordinary pages — complex multi-column forms can
 * still be ambiguous.
 */
function orderPdfItemsVisually(records) {
  const pages = new Map();
  for (const record of records) {
    const page = pages.get(record.page) || [];
    page.push(record);
    pages.set(record.page, page);
  }

  const ordered = [];
  for (const pageNumber of [...pages.keys()].sort((a, b) => a - b)) {
    const source = pages.get(pageNumber).sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];

    for (const record of source) {
      const line = lines.find((candidate) =>
        Math.abs(record.y - candidate.y) <= Math.max(1.5, Math.max(record.height, candidate.height) * 0.4)
      );
      if (line) {
        line.records.push(record);
      } else {
        lines.push({ y: record.y, height: record.height, records: [record] });
      }
    }

    for (const line of lines) {
      line.records.sort((a, b) => a.x - b.x || a.sourceIndex - b.sourceIndex);
      ordered.push(...line.records);
    }
  }
  return ordered;
}

async function extractPdfOriginalLayout(file, onProgress) {
  const pdfjs = await loadPdfJs();
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await pdfjs.getDocument({ data }).promise;

  const root = document.createElement("div");
  root.className = "pdf-pages";
  const tokens = [];
  const spans = [];
  let spoken = "";

  // A target width rather than a fixed scale, so the rendered page fills
  // the same reading column as every other format instead of coming out
  // a fixed size regardless of viewport — capped so a phone-width column
  // doesn't force a blurry upscale of a small source page.
  const targetWidth = Math.min(el.reader?.clientWidth || 900, 1100) * (window.devicePixelRatio || 1);

  for (let n = 1; n <= doc.numPages; n++) {
    onProgress?.(n, doc.numPages);
    const page = await doc.getPage(n);
    const unscaled = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: targetWidth / unscaled.width });

    const pageEl = document.createElement("div");
    pageEl.className = "pdf-page";
    pageEl.style.width = viewport.width / (window.devicePixelRatio || 1) + "px";
    pageEl.style.height = viewport.height / (window.devicePixelRatio || 1) + "px";

    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    pageEl.appendChild(canvas);

    // The text layer's own coordinate space has to match the canvas's
    // CSS size, not its (device-pixel-ratio-scaled) internal resolution,
    // or every word lands at the wrong place once the canvas is scaled
    // back down by that same ratio via its own CSS width/height above.
    const cssViewport = page.getViewport({ scale: viewport.scale / (window.devicePixelRatio || 1) });
    const textLayerDiv = document.createElement("div");
    textLayerDiv.className = "textLayer";
    // TextLayer's own per-word inline styles (font-size, letter-spacing)
    // are all `calc(var(--scale-factor) * Npx)` expressions — it expects
    // whoever hosts it to define that custom property. The full pdf.js
    // viewer sets it on the page container; since we drive TextLayer
    // directly, without that viewer, nothing ever set it. Left undefined,
    // every such calc() falls back to the *inherited* font-size (the
    // reader's own reading-size text) instead of each word's real PDF
    // size, so word boxes end up far larger than their canvas glyphs —
    // exactly what let highlight boxes drift into blank space or past
    // line ends, and let a manual selection reveal oversized fallback
    // text instead of staying invisible over the correctly-sized glyph.
    textLayerDiv.style.setProperty("--scale-factor", String(cssViewport.scale));
    pageEl.appendChild(textLayerDiv);

    const textContent = await page.getTextContent();
    const textLayer = new pdfjs.TextLayer({
      textContentSource: textContent,
      container: textLayerDiv,
      viewport: cssViewport,
    });
    await textLayer.render();

    // Each PDF text item has a matching positioned div. Build invisible word
    // nodes inside it; visual coordinate ordering is established below.
    const divs = textLayer.textDivs;
    const pageRecords = [];

    for (let i = 0; i < textContent.items.length; i++) {
      const item = textContent.items[i];
      if (!item.str) continue;
      const div = divs[i];
      if (!div) continue;

      const text = item.str
        .replace(LIGATURE_RE, (c) => LIGATURES[c] || c)
        .split(SOFT_HYPHEN).join("");
      div.replaceChildren();
      let cursor = 0, m;
      const words = [];
      WORD_RE.lastIndex = 0;
      while ((m = WORD_RE.exec(text)) !== null) {
        if (m.index > cursor) div.appendChild(document.createTextNode(text.slice(cursor, m.index)));
        const span = document.createElement("span");
        span.className = "w";
        span.textContent = m[0];
        words.push({ span, text: m[0], start: m.index, end: m.index + m[0].length });
        div.appendChild(span);
        cursor = m.index + m[0].length;
      }
      if (cursor < text.length) div.appendChild(document.createTextNode(text.slice(cursor)));

      pageRecords.push({
        page: n,
        sourceIndex: i,
        x: item.transform[4],
        y: item.transform[5],
        width: item.width || 0,
        height: item.height || Math.abs(item.transform[3]) || 10,
        text,
        words,
      });
    }

    root.appendChild(pageEl);

    const visualRecords = orderPdfItemsVisually(pageRecords);
    if (n > 1 && spoken && visualRecords.length) spoken += "\n\n";
    let previous = null;

    for (const record of visualRecords) {
      if (previous) {
        const h = Math.max(record.height, previous.height, 10);
        const sameLine = Math.abs(record.y - previous.y) <= Math.max(1.5, h * 0.4);
        if (sameLine) {
          const gap = record.x - (previous.x + previous.width);
          if (gap > h * 0.18 && !/\s$/.test(spoken) && !/^\s/.test(record.text)) spoken += " ";
        } else {
          const vgap = previous.y - record.y;
          spoken += vgap > h * 2.5 ? "\n\n" : " ";
        }
      }

      const base = spoken.length;
      for (const word of record.words) {
        word.span.dataset.i = String(tokens.length);
        tokens.push({
          index: tokens.length,
          text: word.text,
          start: base + word.start,
          end: base + word.end,
        });
        spans.push(word.span);
      }
      spoken += record.text;
      previous = record;
    }
  }

  // Not trimmed or whitespace-collapsed: doing so here would shift every
  // token's offset out from under a string whose length it was already
  // measured against, item by item, above.
  return {
    tree: root,
    text: spoken,
    tokens,
    spans,
    pages: doc.numPages,
    rangeHighlighter: createNativeRangeHighlighter(spans),
  };
}

/* ------------------------------------------------------------------ */

/** Holds on to the untouched source so the Clean markup toggle can switch
 *  between raw and cleaned without needing the original file again. */
async function loadRaw(raw, label, { forceMarkdown = false, cleanable = true, note = "", html = null } = {}) {
  exitEpubMode();
  app.raw = { text: raw, forceMarkdown, cleanable, html };
  app.engine?.stop();
  app.renderer.clear();
  const doc = await prepareDoc(raw, { forceMarkdown, cleanable, html });
  app.load(doc.text, doc.tree);
  setSource(label);
  toast(`Loaded ${label}${note}`);
}

/** Hides the chapter picker and drops the parsed book. Called at the start
 *  of every non-EPUB load path, so switching to a plain file or pasted
 *  text never leaves a stale chapter list pointing at nothing. */
function exitEpubMode() {
  if (!app.epub) return;
  app.epub = null;
  el.chapterSelect.classList.add("hidden");
  el.chapterSelect.replaceChildren();
}

/** Parses and displays one chapter of the currently loaded EPUB. Chapters
 *  are re-parsed from their stored HTML each time rather than cached as a
 *  mutated DOM, the same way Markdown re-renders from source text on every
 *  load — buildFromDom mutates whatever tree it is given. */
function openEpubChapter(index) {
  const book = app.epub;
  const chapter = book.chapters[index];
  if (!chapter) return;

  book.currentIndex = index;
  app.raw = null;   // no raw/rendered toggle for a book chapter
  app.engine?.stop();
  app.renderer.clear();

  const root = parseEpubChapter(chapter.html, book.resources);
  app.load(null, root);

  // The chapter dropdown already shows which chapter this is, and the
  // book title alongside it made the combined label collide with the
  // chapter/voice selects on anything narrower than a wide desktop —
  // short label visible, full context still available on hover.
  setSource(chapter.title, `${book.title} — ${chapter.title}`);
  el.chapterSelect.value = String(index);
}

async function importFile(file) {
  const isPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
  const isEpub = /\.epub$/i.test(file.name) || file.type === "application/epub+zip";
  const isText = TEXT_EXT.test(file.name) || file.type.startsWith("text/");

  if (!isPdf && !isEpub && !isText) {
    toast(`Can't read ${file.name} — text, Markdown, PDF, and EPUB only.`);
    return;
  }

  try {
    if (isEpub) {
      toast(`Opening ${file.name}…`, 60000);
      const book = await extractEpub(file);
      app.epub = { ...book, currentIndex: 0 };

      el.chapterSelect.replaceChildren(
        ...book.chapters.map((c, i) => {
          const o = document.createElement("option");
          o.value = String(i);
          o.textContent = c.title;
          return o;
        })
      );
      el.chapterSelect.classList.toggle("hidden", book.chapters.length < 2);

      openEpubChapter(0);
      toast(`Loaded ${book.title} · ${book.chapters.length} chapter${book.chapters.length === 1 ? "" : "s"}`);
      return;
    }

    if (isPdf) {
      toast(`Rendering ${file.name}…`, 60000);
      const { tree, text, tokens, spans, pages, rangeHighlighter } = await extractPdfOriginalLayout(file, (n, total) => {
        toast(`Rendering page ${n} of ${total}…`, 60000);
      });

      if (!tokens.length) {
        toast("No text found — this PDF is probably scanned images, which need OCR.");
        return;
      }
      exitEpubMode();
      app.raw = null;   // no raw/rendered toggle for a fixed-layout page
      app.engine?.stop();
      app.renderer.clear();
      app.load(null, tree, { text, tokens, spans, rangeHighlighter });
      setSource(file.name);
      toast(`Loaded ${file.name} · ${pages} page${pages === 1 ? "" : "s"}`);
      return;
    }

    const raw = await file.text();
    if (!raw.trim()) { toast("That file is empty."); return; }
    loadRaw(raw, file.name, { forceMarkdown: /\.(md|markdown)$/i.test(file.name) });
  } catch (err) {
    const offline = /Failed to fetch|dynamically imported|NetworkError/i.test(err.message || "");
    toast(
      offline
        ? "Couldn't load a required library — this file type needs a network connection."
        : `Couldn't read that file: ${err.message}`
    );
  }
}

/* --- file picker --- */
const fileInput = document.getElementById("fileInput");
document.getElementById("btnOpen").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) importFile(fileInput.files[0]);
  fileInput.value = "";   // allow re-picking the same file
});

el.chapterSelect.addEventListener("change", () => {
  openEpubChapter(Number(el.chapterSelect.value));
});

/* --- clipboard ---
 * navigator.clipboard.readText() is gated behind a permission that browsers
 * grant inconsistently — Chrome prompts and remembers the answer, Firefox
 * and Safari refuse it outright, and an installed PWA can land in either
 * camp depending on how it was launched. When it's refused there used to be
 * no way forward: a toast and a dead end.
 *
 * A real user-triggered paste (Ctrl+V, or the OS's Paste menu item) needs
 * no such permission — it's the browser delivering an actual "paste" DOM
 * event, not a script asking for standing clipboard access. That's the
 * fallback below, via a hidden field dedicated to catching it. Because it
 * needs no permission at all, it's also wired up globally so Ctrl+V works
 * anywhere on the page, not just after clicking the toolbar button.
 */
const pasteCatcher = document.createElement("textarea");
pasteCatcher.setAttribute("aria-hidden", "true");
pasteCatcher.tabIndex = -1;
Object.assign(pasteCatcher.style, {
  position: "fixed", top: "0", left: "0", width: "1px", height: "1px",
  opacity: "0", pointerEvents: "none",
});
document.body.appendChild(pasteCatcher);

// html is the clipboard's text/html flavour, when present — pasting a
// rich answer (Copilot, a browser selection) commonly puts a fully
// formatted HTML payload on the clipboard alongside a text/plain fallback
// that's been flattened to plain prose, no ** or | left in it at all.
// Reading only text/plain, as this used to, got the flattened fallback
// with nothing left for Markdown detection to find, even though the same
// paste looked perfectly formatted in an app that reads the HTML flavour.
function handlePastedText(text, html = null) {
  if (!text || !text.trim()) { toast("Clipboard is empty."); return; }
  loadRaw(text, "pasted text", {
    note: ` · ${text.length.toLocaleString()} characters`,
    html,
  });
}

/* --------------------------- web articles --------------------------- *
 * A shared or pasted link is fetched natively (see fetchUrl in
 * TtsBridge.java) — CORS blocks an arbitrary cross-origin fetch from the
 * page's own JS, but that is a browser restriction, not a limit on the
 * native HTTP request the Android side makes instead. There is no
 * equivalent path on desktop, so this whole section is Android-only;
 * fetchAndReadUrl says so plainly rather than failing silently.
 * ---------------------------------------------------------------------- */

const READABILITY_URL = "https://cdn.jsdelivr.net/npm/@mozilla/readability@0.6.0/Readability.js";
let readabilityPromise = null;

/** Fetched only the first time a link actually needs its article
 *  extracted, so every other input format stays independent of it —
 *  mirrors loadMarked and loadJSZip above. */
function loadReadability() {
  if (!readabilityPromise) {
    readabilityPromise = new Promise((resolve, reject) => {
      if (window.Readability) return resolve(window.Readability);
      const script = document.createElement("script");
      script.src = READABILITY_URL;
      script.onload = () => resolve(window.Readability);
      script.onerror = () => reject(new Error("Failed to fetch Readability"));
      document.head.appendChild(script);
    }).catch((err) => { readabilityPromise = null; throw err; });
  }
  return readabilityPromise;
}

/** A freshly parsed document's own baseURI is this app's location, not the
 *  fetched page's — sanitizeHtmlDoc resolves img/a URLs from the raw
 *  attribute string, not the browser's resolved DOM property, so a
 *  relative "/photo.jpg" would otherwise point at this app, not the
 *  source site. Rewriting attributes to absolute URLs before Readability
 *  serializes its output means sanitizeHtmlDoc needs no changes at all —
 *  by the time it reads anything, every URL already is absolute. */
function absolutizeUrls(doc, baseUrl) {
  doc.querySelectorAll("img[src]").forEach((img) => {
    try { img.setAttribute("src", new URL(img.getAttribute("src"), baseUrl).href); } catch {}
  });
  doc.querySelectorAll("a[href]").forEach((a) => {
    try { a.setAttribute("href", new URL(a.getAttribute("href"), baseUrl).href); } catch {}
  });
}

function fetchAndReadUrl(url) {
  if (!window.AndroidTTS?.fetchUrl) {
    toast("Reading a web page needs the Android app.");
    return;
  }
  toast(`Fetching ${url}…`, 60000);
  window.AndroidTTS.fetchUrl(url);
}

/** Called by TtsBridge.fetchUrl's native callback — see the JSDoc there
 *  for why this has to be async rather than a return value. */
window.onUrlFetched = async function (url, html, error) {
  if (error) { toast(error); return; }
  try {
    const articleDoc = new DOMParser().parseFromString(html, "text/html");
    absolutizeUrls(articleDoc, url);

    const Readability = await loadReadability();
    const article = new Readability(articleDoc).parse();
    if (!article?.content || !article.textContent.trim()) {
      toast("Couldn't find readable article content on that page.");
      return;
    }

    const contentDoc = new DOMParser().parseFromString(article.content, "text/html");
    // Readability drops the article's own <h1> when it duplicates the
    // title it already detected, which is correct for display (setSource
    // already shows it in the toolbar) but would mean the headline is
    // simply never spoken — putting it back here is what makes a read of
    // the article actually start with its title, the way a person would.
    if (article.title) {
      const h1 = contentDoc.createElement("h1");
      h1.textContent = article.title;
      contentDoc.body.insertBefore(h1, contentDoc.body.firstChild);
    }
    const tree = sanitizeHtmlDoc(contentDoc, (src) => (SAFE_IMAGE.test(src) ? src : null));

    exitEpubMode();
    app.raw = null;   // no raw/rendered toggle for a fetched page
    app.engine?.stop();
    app.renderer.clear();
    app.load(null, tree);
    setSource(article.title || url, url);
    toast(`Loaded "${article.title || url}"`);
  } catch (err) {
    toast(`Couldn't read that page: ${err.message}`);
  }
};

/** True only when the whole trimmed string is nothing but a link — a
 *  sentence that happens to contain a URL should still be read as text,
 *  not silently redirected into a page fetch instead of what was actually
 *  copied or shared. */
function looksLikeBareUrl(text) {
  const trimmed = text.trim();
  if (/\s/.test(trimmed)) return false;
  try {
    const u = new URL(trimmed);
    return u.protocol === "http:" || u.protocol === "https:";
  } catch {
    return false;
  }
}

/** The entry point for Android's Share sheet (see MainActivity's
 *  deliverPendingShare), distinct from handlePastedText: sharing a link
 *  from another app is already an explicit, deliberate action — unlike a
 *  clipboard that might just happen to hold a stale URL — so this fetches
 *  it directly rather than routing through the confirm-first prompt below. */
function handleSharedText(text) {
  if (looksLikeBareUrl(text)) { fetchAndReadUrl(text.trim()); return; }
  handlePastedText(text);
}

/**
 * Called from Android's MainActivity.onResume(), on every return to the
 * app — not just a cold launch, since this only ever suggests a paste
 * rather than performing one, so there's nothing destructive about
 * checking often. Silently auto-pasting here instead would risk wiping an
 * in-progress read every time the app came back to the foreground with
 * unrelated clipboard contents (an address copied for maps, an OTP, a
 * link) — asking first costs one tap and avoids all of that.
 *
 * `lastClipPrompt` remembers the last clipboard text this was already
 * shown for (accepted or dismissed either way), so returning to the app
 * repeatedly without copying anything new doesn't re-show the same offer
 * every time. It also skips text identical to what's already loaded, for
 * the same reason.
 */
let lastClipPrompt = null;
let pendingClip = null;
const clipPrompt = document.getElementById("clipPrompt");
const clipPromptText = document.getElementById("clipPromptText");

function checkClipboardOnResume() {
  if (!window.AndroidTTS?.readClipboardText) return;
  const text = window.AndroidTTS.readClipboardText();
  if (!text || !text.trim()) return;
  if (text === lastClipPrompt || text === app.raw?.text) return;

  const isUrl = looksLikeBareUrl(text);
  pendingClip = { text, html: isUrl ? null : (window.AndroidTTS.readClipboardHtml?.() || null), isUrl };
  if (isUrl) {
    clipPromptText.textContent = `Fetch and read ${text.trim()}?`;
  } else {
    const preview = text.trim().replace(/\s+/g, " ").slice(0, 40);
    clipPromptText.textContent = `Paste "${preview}${text.trim().length > 40 ? "…" : ""}"?`;
  }
  clipPrompt.classList.remove("hidden");
}

function dismissClipPrompt(accept) {
  clipPrompt.classList.add("hidden");
  if (!pendingClip) return;
  lastClipPrompt = pendingClip.text;
  if (accept) {
    if (pendingClip.isUrl) fetchAndReadUrl(pendingClip.text.trim());
    else handlePastedText(pendingClip.text, pendingClip.html);
  }
  pendingClip = null;
}

document.getElementById("clipPromptPaste").addEventListener("click", () => dismissClipPrompt(true));
document.getElementById("clipPromptDismiss").addEventListener("click", () => dismissClipPrompt(false));

pasteCatcher.addEventListener("paste", (e) => {
  e.preventDefault();
  handlePastedText(
    e.clipboardData?.getData("text/plain") ?? e.clipboardData?.getData("text"),
    e.clipboardData?.getData("text/html") || null
  );
  pasteCatcher.blur();
});

// A real editable element — the raw-text editor, a form field — must keep
// its own native paste behaviour; only step in when nothing else would.
window.addEventListener("paste", (e) => {
  const t = e.target;
  if (t === pasteCatcher) return;   // handled above
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable)) return;
  const text = e.clipboardData?.getData("text/plain") ?? e.clipboardData?.getData("text");
  if (!text) return;
  e.preventDefault();
  handlePastedText(text, e.clipboardData?.getData("text/html") || null);
});

document.getElementById("btnPaste").addEventListener("click", async () => {
  // The Android wrapper loads this page over file://, where the web
  // Clipboard API has no prompt UI to appear in at all — WebView isn't
  // Chrome, it never asks, it just rejects. readClipboardText() bridges to
  // Android's own ClipboardManager instead, sidestepping the web
  // permission entirely rather than falling back to a Ctrl+V that a touch
  // keyboard doesn't have.
  if (window.AndroidTTS?.readClipboardText) {
    handlePastedText(
      window.AndroidTTS.readClipboardText(),
      window.AndroidTTS.readClipboardHtml?.() || null
    );
    return;
  }
  // file:// has no origin to attach a permission to, so Chrome/Edge/Firefox
  // never show the clipboard-read prompt there — readText() would just
  // reject every time, for every user, forever. Skip straight to the
  // manual path instead of pretending a retry might someday succeed.
  if (location.protocol !== "file:" && navigator.clipboard?.read) {
    try {
      const items = await navigator.clipboard.read();
      let text = "", html = null;
      for (const item of items) {
        if (item.types.includes("text/plain")) {
          text = await (await item.getType("text/plain")).text();
        }
        // The read() API can expose text/html even though readText() —
        // used below as the fallback for a browser without read() at all
        // — is permanently limited to plain text by its own spec.
        if (item.types.includes("text/html")) {
          html = await (await item.getType("text/html")).text();
        }
      }
      handlePastedText(text, html);
      return;
    } catch (_) {
      // Falls through to the manual-paste path below.
    }
  } else if (location.protocol !== "file:" && navigator.clipboard?.readText) {
    try {
      handlePastedText(await navigator.clipboard.readText());
      return;
    } catch (_) {
      // Falls through to the manual-paste path below.
    }
  }
  pasteCatcher.value = "";
  pasteCatcher.focus();
  toast(
    location.protocol === "file:"
      ? "Paste needs Ctrl+V here — one-click paste only works when this is opened over http(s), e.g. the installed app or GitHub Pages."
      : "Press Ctrl+V (or Cmd+V) to paste."
  );
});

/* --- drag and drop --- */
const dropEl = document.getElementById("drop");
let dragDepth = 0;   // counter, because dragenter/leave fire per child element

window.addEventListener("dragenter", (e) => {
  if (!e.dataTransfer?.types.includes("Files")) return;
  dragDepth++;
  dropEl.classList.add("on");
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove("on"); }
});
window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  dropEl.classList.remove("on");
  const file = e.dataTransfer?.files?.[0];
  if (file) importFile(file);
});

/* ------------------------------------------------------------------ *
 * 7. PLAYER CONTROLS
 * ------------------------------------------------------------------ */

/** Icon buttons drive hidden checkboxes, so the state lives in one place
 *  and the existing change handlers keep working untouched. */
function bindToggle(button, input, { announce } = {}) {
  const sync = () => button.setAttribute("aria-pressed", String(input.checked));
  button.addEventListener("click", () => {
    input.checked = !input.checked;
    sync();
    input.dispatchEvent(new Event("change"));
    if (announce) toast(announce(input.checked));
  });
  sync();
}

bindToggle(el.btnClean, el.clean);   // its own change handler already toasts
bindToggle(el.btnFollow, el.autoscroll, {
  announce: (on) => (on ? "Following the spoken word" : "Follow off"),
});

/* --- overflow sheet (phones) --- */
const tools = document.getElementById("tools");
const btnMore = document.getElementById("btnMore");

function closeTools() {
  tools.classList.remove("open");
  btnMore.setAttribute("aria-expanded", "false");
}

btnMore.addEventListener("click", (e) => {
  e.stopPropagation();
  const open = tools.classList.toggle("open");
  btnMore.setAttribute("aria-expanded", String(open));
});

// Any action inside the sheet closes it, so the reader is not left covered.
tools.addEventListener("click", (e) => {
  if (e.target.closest("button")) closeTools();
});
document.addEventListener("click", (e) => {
  if (tools.classList.contains("open") && !tools.contains(e.target)) closeTools();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeTools();
});

/* --- text size --- */
const READER_SIZES = [17, 20, 23, 27];
let sizeIndex = 1;
el.btnFont.addEventListener("click", () => {
  sizeIndex = (sizeIndex + 1) % READER_SIZES.length;
  document.documentElement.style.setProperty("--reader-size", `${READER_SIZES[sizeIndex]}px`);
  toast(`Text size ${READER_SIZES[sizeIndex]}px`);
});

/* --- speed --- *
 * The slider moves over ladder indices rather than raw rates, so every
 * position lands exactly on a defined speed instead of somewhere between
 * two of them. The hidden #rate input stays the single source of truth. */
const SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4, 5];

el.speedSlider.max = String(SPEEDS.length - 1);
el.dial = document.getElementById("speedDial");
el.dialArc = document.getElementById("dialArc");

const DIAL_R = 16;
const DIAL_CIRCUM = 2 * Math.PI * DIAL_R;
const DIAL_SWEEP = DIAL_CIRCUM * 0.75;   // 270 degrees, gap at the bottom

el.dial.setAttribute("aria-valuemax", String(SPEEDS.length - 1));
document.querySelector(".dial-track").style.strokeDasharray =
  `${DIAL_SWEEP.toFixed(2)} ${DIAL_CIRCUM.toFixed(2)}`;

function setSpeedIndex(i) {
  const clamped = Math.max(0, Math.min(SPEEDS.length - 1, Math.round(i)));
  if (Number(el.speedSlider.value) === clamped && el.dialArc.style.strokeDasharray) return;
  el.speedSlider.value = String(clamped);
  el.rate.value = String(SPEEDS[clamped]);
  el.rate.dispatchEvent(new Event("input"));   // reuses the existing handler
}

function renderDial() {
  const i = Number(el.speedSlider.value);
  const filled = DIAL_SWEEP * (i / (SPEEDS.length - 1));
  el.dialArc.style.strokeDasharray = `${filled.toFixed(2)} ${DIAL_CIRCUM.toFixed(2)}`;
  el.dial.setAttribute("aria-valuenow", String(i));
  el.dial.setAttribute("aria-valuetext", `${SPEEDS[i]} times speed`);
}

/* Drag vertically to turn it; a tap without movement steps up one notch. */
let dialDrag = null;
const DIAL_PIXELS_PER_STEP = 11;

el.dial.addEventListener("pointerdown", (e) => {
  dialDrag = { y: e.clientY, from: Number(el.speedSlider.value), moved: false };
  el.dial.setPointerCapture(e.pointerId);
});

el.dial.addEventListener("pointermove", (e) => {
  if (!dialDrag) return;
  const steps = Math.round((dialDrag.y - e.clientY) / DIAL_PIXELS_PER_STEP);
  if (steps !== 0) dialDrag.moved = true;
  setSpeedIndex(dialDrag.from + steps);
});

el.dial.addEventListener("pointerup", (e) => {
  if (dialDrag && !dialDrag.moved) {
    const i = Number(el.speedSlider.value);
    setSpeedIndex(i >= SPEEDS.length - 1 ? 0 : i + 1);   // tap cycles, wrapping
  }
  dialDrag = null;
  el.dial.releasePointerCapture?.(e.pointerId);
});
el.dial.addEventListener("pointercancel", () => { dialDrag = null; });

el.dial.addEventListener("wheel", (e) => {
  e.preventDefault();
  setSpeedIndex(Number(el.speedSlider.value) + (e.deltaY < 0 ? 1 : -1));
}, { passive: false });

el.dial.addEventListener("keydown", (e) => {
  const i = Number(el.speedSlider.value);
  if (e.key === "ArrowUp" || e.key === "ArrowRight") { e.preventDefault(); setSpeedIndex(i + 1); }
  else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); setSpeedIndex(i - 1); }
  else if (e.key === "Home") { e.preventDefault(); setSpeedIndex(0); }
  else if (e.key === "End") { e.preventDefault(); setSpeedIndex(SPEEDS.length - 1); }
});

/** Keep the slider on the right notch when the rate is changed elsewhere. */
function syncSpeedSlider() {
  const current = parseFloat(el.rate.value);
  let nearest = 0;
  for (let i = 1; i < SPEEDS.length; i++) {
    if (Math.abs(SPEEDS[i] - current) < Math.abs(SPEEDS[nearest] - current)) nearest = i;
  }
  el.speedSlider.value = String(nearest);
}

/* --- sentence skip --- */
function skipSentence(delta) {
  const ranges = app.sentenceRanges;
  if (!ranges || !ranges.length) return;
  const active = app.renderer.active;
  const from = active >= 0 ? app.sentenceOfToken[active] : 0;

  // Ranges can have gaps where a split produced no words, so walk past them.
  let target = from + delta;
  while (target >= 0 && target < ranges.length && !ranges[target]) target += delta || 1;
  target = Math.max(0, Math.min(ranges.length - 1, target));

  const range = ranges[target];
  if (range) app.seekToToken(range[0]);
}
el.back.addEventListener("click", () => skipSentence(-1));
el.fwd.addEventListener("click", () => skipSentence(1));

/* --- scrub --- */
el.seekBar.addEventListener("click", (e) => {
  if (!app.tokens.length) return;
  const box = el.seekBar.getBoundingClientRect();
  const fraction = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
  app.seekToToken(Math.min(app.tokens.length - 1, Math.floor(fraction * app.tokens.length)));
});

/* Registers the service worker so the browser can offer "Install app" and
   the page keeps working offline once installed. Relative path, so this
   still resolves correctly if the site is ever served from a subpath
   (e.g. a GitHub Pages project site at /WordBeat/). No custom install
   button — Chrome and Edge already show one in the address bar once this
   and the manifest are in place, which is simpler than reimplementing it. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

app.raw = { text: SAMPLE, forceMarkdown: false, cleanable: true };
app.load(SAMPLE);

// Browsers restore form state across a reload, and some do it without
// firing `input` — which would leave the slider, its label, the speed
// dial, and the engine's rate silently disagreeing. Sync once from
// whatever the control actually holds at startup. Deliberately the very
// last statement in the file: this handler touches SPEEDS and the dial,
// both defined further down in the Player Controls section, and firing
// it any earlier hits them before their const declarations run.
el.rate.dispatchEvent(new Event("input"));
</script>
